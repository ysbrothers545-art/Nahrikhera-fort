<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAHRIKHERA FORT - Naruka Heritage | Rajasthan</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--dark:#0f1f18;--dark2:#13261e;--cream:#f6f1e7;--gold:#c8a86a;--gold2:#e8d9b0;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--cream);color:var(--dark);line-height:1.7}
h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:300}
header{background:var(--dark);color:var(--cream);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:99}
header .logo{font-family:'Cormorant Garamond';line-height:1}
header .logo b{display:block;font-size:16px;letter-spacing:2px}
header .logo span{font-size:9px;letter-spacing:2px;color:var(--gold)}

/* HERO */
.hero{background:linear-gradient(to bottom, rgba(15,31,24,0.7), rgba(15,31,24,0.9)), url('https://images.unsplash.com/photo-1599661046289-e31897846e41');background-size:cover;background-position:center;color:var(--cream);padding:80px 24px 40px}
.hero small{letter-spacing:4px;font-size:10px;color:var(--gold)}
.hero h1{font-size:56px;line-height:0.9;margin:20px 0;text-transform:uppercase}
.hero h1 em{font-style:italic;color:var(--cream);opacity:0.9}
.hero p{max-width:500px;color:#c9c9c9;font-size:15px;margin-top:15px}
.btn{display:inline-block;padding:12px 22px;border:1px solid var(--gold2);margin:10px 10px 0 0;font-size:11px;letter-spacing:2px;text-decoration:none;color:var(--gold2)}
.btn.fill{background:var(--gold2);color:var(--dark)}
.ticker{border-top:1px solid rgba(200,168,106,0.2);margin-top:30px;padding-top:12px;font-size:9px;letter-spacing:2px;color:var(--gold)}

/* SECTIONS */
.section{padding:60px 24px}
.dark{background:var(--dark);color:var(--cream)}
.cream{background:var(--cream)}
.label{font-size:9px;letter-spacing:3px;color:var(--gold);margin-bottom:10px}
.big{font-size:38px;line-height:1.1;margin-bottom:20px}
.big i{font-style:italic}
.frame{border:12px solid #d4b078;outline:2px solid #8c6a3a;box-shadow:0 10px 30px rgba(0,0,0,0.3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0}
@media(max-width:600px){.grid2{grid-template-columns:1fr} .hero h1{font-size:40px}}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:30px;border-top:1px solid #ddd;padding-top:20px}
.stat h3{font-size:28px}
.lineage-box{background:#fff;border:1px solid #e9e0cc;padding:18px;margin:12px 0;text-align:center}
.lineage-box b{display:block;font-family:'Cormorant Garamond';font-size:20px}
